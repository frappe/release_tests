[project]
name = "release_tests"
description = "External HTTP release-test harness for Frappe sites — logs in over REST and exercises per-app flows across multiple versions (develop / v16 / v15)."
authors = [
    { name = "Release Tests Contributors", email = "umair_sayyed@yahoo.com" },
]
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests>=2.28",
    "packaging>=21.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.4",
]

[project.scripts]
release-tests = "release_tests.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "release_tests/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["release_tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Timezone-aware datetimes (DTZ) are deliberately not enforced here. These helpers
# build *date strings* that are posted to a target Frappe site — posting dates,
# leave dates, period bounds. The timezone that matters is the target site's, not
# the harness host's, so pinning them to UTC would be actively wrong: near midnight
# UTC's date differs from the operator's, silently shifting a posting date by a day.
# Getting this genuinely right means asking the site for its own date (as
# frappe_filters already does via a row's `creation` stamp), which is a refactor,
# not a lint fix. Until then, naive local dates are the intended behaviour.
ignore = ["DTZ005", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
