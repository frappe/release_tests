name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint
        run: uvx ruff check release_tests tests

      - name: Run harness tests (mocked, no live site)
        run: uv run --extra dev pytest -q
